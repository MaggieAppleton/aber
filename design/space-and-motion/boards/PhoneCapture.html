<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aber · Phone Capture</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
body{margin:0}
a{color:#1C1B19}a:hover{color:#2457D6}
textarea::placeholder{color:#5F5D57;opacity:1}
</style>
</head>
<body>

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: #F6F5F2; color: #1C1B19; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 20px">

  <div style="flex: 1; min-height: 0; position: relative; box-sizing: border-box; padding-bottom: 282px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end">

    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; padding: 44px 8px 0">
        <span style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5h8M7 9h8M7 13h8M3.5 5h.01M3.5 9h.01M3.5 13h.01"></path></svg></span>
        <span style="flex: 1; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.04em">ABER</span>
        <span style="position: relative; width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 10.5l2-6.5h9l2 6.5v4h-13z"></path><path d="M2.5 10.5h4l1 2h3l1-2h4"></path></svg><span style="position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 4px; border: 1.5px dashed #8A877F; border-radius: 9px; background: #F6F5F2; font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 15px; display: flex; align-items: center; justify-content: center; color: #5F5D57">7</span></span>
      </div>
      <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: #5F5D57">PROTOTYPES</span>
          <div style="display: flex; gap: 12px">
            <div style="flex: none; display: flex; align-items: center; gap: 12px; height: 44px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #D9D6CE; border-radius: 10px"><span style="font-weight: 600; white-space: nowrap">Memory inspector</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5D57">building</span></div>
            <div style="flex: none; display: flex; align-items: center; gap: 12px; height: 44px; box-sizing: border-box; padding: 0 14px; background: #FFFFFF; border: 1px solid #D9D6CE; border-radius: 10px"><span style="font-weight: 600; white-space: nowrap">Token budget meter</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5D57">idea</span></div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 20px; line-height: 26px; font-weight: 600">Cost of intelligence</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F5D57">23 signals · 2 theories · 3 not yet yours</span>
          </div>
          <div style="padding: 16px; background: #FFFFFF; border: 1px solid #D9D6CE; border-radius: 10px"><span style="font-size: 16px; line-height: 22px; font-weight: 600">Tokens become nearly free</span></div>
        </div>
      </div>
    </div>

    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(28,27,25,0.08)"></div>

    <section aria-label="Recent dumps" style="position: relative; flex: none; margin: 0 12px 8px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 -8px 24px rgba(28,27,25,0.12); overflow: hidden">
      <div aria-hidden="true" style="width: 36px; height: 4px; margin: 8px auto 0; border-radius: 2px; background: #D9D6CE"></div>
      <h2 style="margin: 0; padding: 12px 16px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: #5F5D57">RECENT DUMPS</h2>

      <div style="position: relative; overflow: hidden; border-top: 1px solid #D9D6CE">
        <button type="button" style="width: 100%; box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: none; background: #FFFFFF; font: inherit; color: #1C1B19; text-align: left; cursor: pointer">
          <span style="flex: none; width: 72px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 20px; color: #5F5D57">08:12</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Open-weight model matches last year's frontier on coding tasks</span>
            <span style="display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 16px; color: #5F5D57"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2.2 2.2"><circle cx="6" cy="6" r="4.5"></circle></svg>Processing…</span>
          </span>
        </button>
      </div>

      <div style="position: relative; overflow: hidden; border-top: 1px solid #D9D6CE">
        <button type="button" aria-label="Delete dump" style="position: absolute; right: 0; top: 0; bottom: 0; width: 80px; border: none; background: #1C1B19; color: #FFFFFF; font: inherit; font-weight: 500; cursor: pointer">Delete</button>
        <button type="button" style="position: relative; transform: translateX(-80px); width: 100%; box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: none; background: #FFFFFF; font: inherit; color: #1C1B19; text-align: left; cursor: pointer">
          <span style="flex: none; width: 72px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 20px; color: #5F5D57">07:40</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Lab cuts API prices again for its small model tier</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 16px; color: #5F5D57">4 signals · 1 draft</span>
          </span>
        </button>
      </div>

      <div style="position: relative; overflow: hidden; border-top: 1px solid #D9D6CE">
        <button type="button" style="width: 100%; box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: none; background: #FFFFFF; font: inherit; color: #1C1B19; text-align: left; cursor: pointer">
          <span style="flex: none; width: 72px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 20px; color: #5F5D57">07:05</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Frontier training runs keep growing in cost</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 16px; color: #5F5D57">1 signal · attached to an existing one</span>
          </span>
        </button>
      </div>

      <div style="position: relative; overflow: hidden; border-top: 1px solid #D9D6CE">
        <button type="button" style="width: 100%; box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: none; background: #FFFFFF; font: inherit; color: #1C1B19; text-align: left; cursor: pointer">
          <span style="flex: none; width: 72px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 20px; color: #5F5D57">Fri 18:47</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Data-centre power contracts are booked years ahead</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 16px; color: #5F5D57">Voice · 6 min · 9 signals · 2 drafts</span>
          </span>
        </button>
      </div>
    </section>

  </div>

  <form aria-label="Dump or ask" style="position: absolute; left: 12px; right: 12px; bottom: 34px">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #FFFFFF; border: 1px solid #D9D6CE; border-radius: 22px; box-shadow: 0 8px 24px rgba(28,27,25,0.14)">
      <div style="display: flex; align-items: center; gap: 8px; height: 44px">
        <span style="flex: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; line-height: 16px; letter-spacing: 0.06em; color: #5F5D57">SEES</span>
        <span style="flex: none; display: flex; align-items: center; height: 32px; box-sizing: border-box; padding-left: 12px; border-radius: 999px; background: #ECEAE4; font-size: 13px; line-height: 18px; color: #1C1B19">
          <span>World</span>
          <button type="button" aria-label="Remove context: World" style="width: 44px; height: 44px; flex: none; margin: -6px 0 -6px -8px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #1C1B19; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"></path></svg></button>
        </span>
        <button type="button" aria-label="Add context from screen" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: transparent; color: #1C1B19; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></svg></button>
      </div>
      <div style="display: flex; gap: 8px">
        <span style="flex: 0 0 auto; display: flex; align-items: center; gap: 6px; height: 46px; box-sizing: border-box; padding-left: 10px; border: 1px solid #D9D6CE; border-radius: 8px; background: #ECEAE4; font-size: 12px; color: #1C1B19">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5l3-3M5 8L3.8 9.2a2.1 2.1 0 0 0 3 3L8 11M11 8l1.2-1.2a2.1 2.1 0 0 0-3-3L8 5"></path></svg>
          <span>x.com/…</span>
          <button type="button" aria-label="Remove x.com link" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #1C1B19; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"></path></svg></button>
        </span>
        <span style="flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; height: 46px; box-sizing: border-box; padding-left: 10px; border: 1px solid #D9D6CE; border-radius: 8px; background: #ECEAE4; font-size: 12px; color: #1C1B19">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M6.5 9.5l3-3M5 8L3.8 9.2a2.1 2.1 0 0 0 3 3L8 11M11 8l1.2-1.2a2.1 2.1 0 0 0-3-3L8 5"></path></svg>
          <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">news.ycombinator.com/…</span>
          <button type="button" aria-label="Remove news.ycombinator.com link" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: #1C1B19; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"></path></svg></button>
        </span>
      </div>
      <label for="dump" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Dump anything, or ask about this screen</label>
      <textarea id="dump" rows="3" placeholder="Dump anything, or ask about this screen" style="display: block; width: 100%; height: 60px; box-sizing: border-box; margin: 0; padding: 0 2px; border: none; outline: none; resize: none; overflow: hidden; background: transparent; font: inherit; font-size: 14px; line-height: 20px; color: #1C1B19">Two links on inference pricing, and a thought: maybe price drops only reach routine work.</textarea>
      <div style="display: flex; align-items: center; gap: 8px">
        <button type="button" aria-label="Record voice" style="width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; border: 1px solid #D9D6CE; border-radius: 10px; background: #FFFFFF; color: #1C1B19; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="6.5" y="2" width="5" height="9" rx="2.5"></rect><path d="M3.5 8.5a5.5 5.5 0 0 0 11 0M9 14v2.5"></path></svg></button>
        <span style="flex: 1"></span>
        <button type="submit" aria-label="Send" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: #1C1B19; color: #FFFFFF; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14.5v-11M4.5 8L9 3.5 13.5 8"></path></svg></button>
      </div>
    </div>
  </form>

</div>
</body>
</html>
